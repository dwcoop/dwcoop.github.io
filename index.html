<link data-lock rel="preconnect" href="https://fonts.googleapis.com"><link data-lock rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link data-lock href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@800&display=swap" rel="stylesheet">
<style data-lock>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#dd3333;color:#fff;font:16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px max(20px,env(safe-area-inset-left))}
main{width:100%;max-width:440px}
h1{font:800 clamp(56px,14vw,84px)/1 "Barlow Condensed",sans-serif;margin:0 0 10px}
.motto{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
.motto span{font:800 22px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;background:#fff;color:#dd3333;padding:7px 11px 6px;border-radius:6px;transform:skewX(-8deg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.motto span:last-child{background:#111;color:#fff}
form{background:#fff;color:#141518;border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=password],input[type=text]{width:100%;font:18px Barlow,system-ui,sans-serif;padding:12px 14px;border:2px solid #d5d8dd;border-radius:10px}
input:focus-visible{outline:none;border-color:#dd3333}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:15px}
.row input{width:20px;height:20px;accent-color:#dd3333}
button{width:100%;min-height:48px;border:0;border-radius:10px;background:#dd3333;color:#fff;font:600 18px Barlow,system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
button:focus-visible{outline:3px solid #141518;outline-offset:2px}
.msg{min-height:22px;margin:10px 0 0;color:#c42a2a;font-size:15px}
.help{font-size:14px;opacity:.9;margin:16px 0 0}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.tip{font-size:13px;color:#555;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1>The Coop</h1>
  <p class="motto"><span>Be Brave.</span> <span>Be Loud.</span> <span>Be the Difference.</span></p>
  <form id="f" method="post" action="#" hidden>
    <input class="sr" id="user" name="username" type="text" autocomplete="username" value="The Coop" tabindex="-1" aria-hidden="true">
    <label for="pw">Your family's password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required>
    <div class="row"><input id="rem" type="checkbox" checked><label for="rem" style="margin:0;font-weight:400">Remember me on this device</label></div>
    <button id="go" type="submit">Unlock</button>
    <p class="msg" id="msg" role="alert"></p>
    <p class="tip">On a phone, let it save the password when asked, then it's one tap next time.</p>
  </form>
  <p class="help">A page for the U8 Reds parents. Ask the team WhatsApp if you don't have your password. Not an official Dorking Wanderers FC site.</p>
</main>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = a => btoa(String.fromCharCode(...a));
const sub = crypto.subtle;
const store = {get(){ try { return localStorage.getItem("coop-k") || sessionStorage.getItem("coop-k"); } catch (_) { return null; } },
  set(k, keep){ try { sessionStorage.setItem("coop-k", k); if (keep) localStorage.setItem("coop-k", k); } catch (_) {} },
  clear(){ try { localStorage.removeItem("coop-k"); sessionStorage.removeItem("coop-k"); } catch (_) {} }};
async function openWith(raw, keep) {
  const key = await sub.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pg = u8(P.page);
  const html = new TextDecoder().decode(await sub.decrypt({name: "AES-GCM", iv: pg.slice(0, 12)}, key, pg.slice(12)));
  store.set(b64(raw), keep);
  window.__coopKey = key;
  // Swap the page in place (never document.write: the viewer's own script must stay in the page).
  const doc = new DOMParser().parseFromString(html, "text/html");
  const scripts = [...doc.querySelectorAll("script")].map(x => { const t = x.textContent; x.remove(); return t; });
  document.querySelectorAll("[data-lock]").forEach(x => x.remove());
  document.title = doc.title;
  for (const el of [...doc.head.children]) if (!/^(TITLE|META)$/.test(el.tagName)) document.head.appendChild(document.importNode(el, true));
  for (const at of [...doc.documentElement.attributes]) if (at.name !== "data-theme") document.documentElement.setAttribute(at.name, at.value);
  document.body.replaceChildren(...[...doc.body.childNodes].map(n => document.importNode(n, true)));
  for (const t of scripts) { const x = document.createElement("script"); x.textContent = t; document.body.appendChild(x); }
  if (location.hash) setTimeout(() => window.dispatchEvent(new HashChangeEvent("hashchange")), 50);
  // visit counter (GoatCounter, no cookies): page views are counted by its script; this marks an unlock
  let tries = 0; const ping = () => { if (window.goatcounter && window.goatcounter.count) { try { window.goatcounter.count({path: "unlocked", title: "Unlocked (password or remembered)", event: true}); } catch (_) {} } else if (tries++ < 20) setTimeout(ping, 500); };
  ping();
}
const norm = s => s.trim().toLowerCase().replace(/[\s_.,]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
async function unlock(pw) {
  const base = await sub.importKey("raw", new TextEncoder().encode(norm(pw)), "PBKDF2", false, ["deriveBits"]);
  const d = new Uint8Array(await sub.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: u8(P.salt), iterations: P.iter}, base, 512));
  const id = [...new Uint8Array(await sub.digest("SHA-256", d.slice(32)))].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 16);
  const slot = P.slots[id];
  if (!slot) return null;
  const s = u8(slot), wk = await sub.importKey("raw", d.slice(0, 32), "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await sub.decrypt({name: "AES-GCM", iv: s.slice(0, 12)}, wk, s.slice(12)));
}
const f = document.getElementById("f"), msg = document.getElementById("msg"), go = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault(); msg.textContent = ""; go.disabled = true; go.textContent = "Unlocking…";
  try {
    const raw = await unlock(document.getElementById("pw").value);
    if (!raw) throw 0;
    try { if (window.PasswordCredential && navigator.credentials) await navigator.credentials.store(new PasswordCredential(document.getElementById("f"))); } catch (_) {}
    await new Promise(r => setTimeout(r, 300));
    await openWith(raw, document.getElementById("rem").checked);
  } catch (e) { if (e) console.error(e); msg.textContent = "That password didn't work. Check it and try again."; go.disabled = false; go.textContent = "Unlock"; }
});
(async () => {
  const k = store.get();
  if (k) { try { await openWith(u8(k), !!(() => { try { return localStorage.getItem("coop-k"); } catch (_) {} })()); return; } catch (_) { store.clear(); } }
  f.hidden = false; document.getElementById("pw").focus();
})();
